[project]
name = "job-queue-service"
version = "0.1.0"
description = "Distributed background job queue"
readme = "README.md"
authors = [
    { name = "haimyu", email = "hy7905y@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.162.2",
    "psycopg[binary,pool]>=3.3.8",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]




